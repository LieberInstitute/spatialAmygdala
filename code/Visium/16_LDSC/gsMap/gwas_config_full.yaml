# gsMap FULL GWAS config -- all 40 brain/behaviour traits used by the classic
# stratified-LDSC run (../LDSC/ldsc_h2_jobs.txt), so gsMap and classic LDSC are
# run on IDENTICAL sumstats and the two 15-domain x 40-trait result tables are
# directly comparable.
#
# Paths point at SYMLINKS under $WORKDIR/GWAS/ created by 03b_stage_gwas_symlinks.sh.
# The real files live read-only in /dcs04/lieber/shared/statsgen/LDSC/base/gwas_brain/
# and are never copied, moved or deleted.
#
# Header of each file is "SNP N Z A1 A2"; gsMap selects columns by NAME
# (usecols in gsMap/utils/regression_read.py), so column order does not matter
# and no format_sumstats step is required.
#
# Trait names SCZ / MDD / Height are deliberately identical to the ones in
# gwas_config_pilot.yaml so the pilot's finished spatial-LDSC output for Br6471
# is reused rather than recomputed under a second name.
#
